# Release on a version tag: git tag -a v1.02 -m "notes…" && git push origin v1.02
# Builds the release APK (signed with the project key from keystore/, same as local builds, so it
# installs over them), runs the unit tests (core/: the logic and the session replays; app/: the
# transports) and publishes a GitHub release with the APK attached.
# The release text is the tag's annotation message.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The session report is closed source: private/ is its own repository, read with a deploy key (read-only, that
      # one repository). Without it the APK would build fine, just with no report — so fail instead.
      - uses: actions/checkout@v4
        with:
          repository: parhipov/OBDScanner-web
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          path: private
      - name: The report generator is there
        run: test -f private/report/src/commonMain/kotlin/com/obdscanner/report/ReportEntry.kt

      # checkout turns an annotated tag into a lightweight one — fetch it again for its message.
      - name: Release notes from the tag
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > notes.md
          cat notes.md

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew :core:jvmTest testDebugUnitTest assembleRelease --console=plain

      # The run log needs a login; annotations don't — each failed test becomes one, with its message.
      - name: Failed tests
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob, html, re
          for p in glob.glob('core/build/test-results/jvmTest/*.xml') + glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              s = open(p, encoding='utf-8').read()
              for m in re.finditer(r'<testcase name="([^"]+)" classname="([^"]+)"[^>]*>\s*<failure message="(.*?)"', s, re.S):
                  msg = html.unescape(m.group(3))[:3000].replace('%', '%25').replace('\r', '').replace('\n', '%0A')
                  print(f"::error title={m.group(2)}.{m.group(1)}::{msg}")
          EOF

      - name: Check the tag matches versionName
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk)
          echo "APK: $apk"
          case "$apk" in *"_${GITHUB_REF_NAME#v}.apk") ;; *) echo "Tag ${GITHUB_REF_NAME} ≠ versionName in app/build.gradle.kts"; exit 1 ;; esac

      - uses: softprops/action-gh-release@v2
        with:
          name: OBD Scanner ${{ github.ref_name }}
          body_path: notes.md
          files: app/build/outputs/apk/release/*.apk
